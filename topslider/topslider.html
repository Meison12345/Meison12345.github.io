<head>
    <link rel="stylesheet" href="/assets/style/normalize.css">
    <link rel="stylesheet" href="/assets/style/style.css">
    <!-- <link rel="stylesheet" href="/topslider/topslider.css"> -->
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<style>
    .swiper {
        max-width: 1920px;
        max-height: 1080px;
        background: linear-gradient(180deg, #E9EAEE 0%, #FFFFFF 100%);
    }

    .swiper-wrapper {
        height: auto;
    }

    .custom-swiper .swiper-pagination-bullet {
        border: 1px solid #4E4E50;
        width: 13px;
        height: 13px;
        background-color: transparent;
    }

    .custom-swiper .swiper-pagination-bullet-active {
        background: #4E4E50;
    }

    .swiper-slide-image {
        width: 100%;
    }

    .swiper-slide-image--mobile {
        display: none;
    }

    @media screen and (max-width:600px) {
        .swiper-slide-image {
            display: none;
        }

        .swiper-slide-image--mobile {
            display: block;
        }
    }

    @media screen and (min-width:600px) {
        .topSlider__title {
            display: none;
        }
    }

    .topSlider__title {
        font-family: 'Zekton';
        font-style: normal;
        font-weight: 400;
        font-size: 27px;
        line-height: 120%;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #4E4E50;
        margin: 40px 43px 20px 20px;
    }

    .topSlider__title-span {
        font-family: 'Mulish';
        font-style: normal;
        font-weight: 400;
        font-size: 16px;
        line-height: 130%;
        color: #4E4E50;
    }
</style>

<section>
    <div class="topslider swiper mySwiper">
        <h1 class="topslider__title">Лучшие мировые
            инновации для благополучия
            Ваших питомцев
            <span class="topslider__title-span">со стремлением к совершенству в разработках и продуктах</span>
        </h1>
        <div class="swiper-wrapper">
            <div class="swiper-slide">
                <img class="swiper-slide swiper-slide-image" src="/assets/img/11.png">
                <img class="swiper-slide swiper-slide-image swiper-slide-image--mobile" src="/assets/img/test.png">
            </div>
            <div class="swiper-slide">
                <img class="swiper-slide swiper-slide-image" src="/assets/img/22.png">
                <img class="swiper-slide swiper-slide-image swiper-slide-image--mobile" src="/assets/img/test.png">
            </div>
            <div class="swiper-slide">
                <img class="swiper-slide swiper-slide-image" src="/assets/img/33.png">
                <img class="swiper-slide swiper-slide-image swiper-slide-image--mobile" src="/assets/img/test.png">
            </div>
            <div class="swiper-slide">
                <img class="swiper-slide swiper-slide-image" src="/assets/img/44.png">
                <img class="swiper-slide swiper-slide-image swiper-slide-image--mobile" src="/assets/img/test.png">
            </div>
        </div>
        <div class="custom-swiper swiper-pagination"></div>
    </div>
</section>

<script>
    const swiper = new Swiper('.mySwiper', {
        loop: true,
        // autoplay: {
        //     delay: 3000,
        // },
        pagination: {
            el: '.swiper-pagination',
            clickable: true,
        },
    });
</script>
